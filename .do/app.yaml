# DigitalOcean App Platform spec for ExCo Live.
# Deploy: connect this GitHub repo in the App Platform UI (it auto-detects
# this file), or run:  doctl apps create --spec .do/app.yaml
#
# IMPORTANT: instance_count MUST stay 1. Live results are broadcast over SSE
# from a single in-memory process; running >1 instance would split audiences
# across processes and break the realtime fan-out. To scale beyond one
# instance you'd add a shared pub/sub (e.g. Redis) + shared store first.
name: exco-live
region: nyc
services:
  - name: web
    # --- source: point this at the repo you push to ---
    github:
      repo: The-ExCo-Group/exco-live
      branch: main
      deploy_on_push: true
    source_dir: /
    # --- runtime ---
    run_command: node server.js
    environment_slug: node-js
    instance_count: 1               # keep at 1 (see note above)
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080                 # App Platform sets PORT=8080; server reads process.env.PORT
    envs:
      - key: NODE_ENV
        value: production
      # --- Supabase (durable store) ---
      # The server persists rooms/polls/votes/Q&A here so state survives
      # redeploys and past events stay queryable. SUPABASE_KEY is the
      # publishable key (safe to store; the server is the only DB client).
      # NOTE: editing this file does NOT push env vars to a running App
      # Platform app — also set these in the DO dashboard (App > Settings >
      # web > Environment Variables) or run `doctl apps update --spec`.
      - key: SUPABASE_URL
        value: https://hstnpuwbjtemdzbezvzw.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_ThtnFIrDyLBRWEtKFSbn7g_OSVsQVOz
      # --- AI features (Claude) ---
      # ANTHROPIC_API_KEY is a SECRET — do NOT hard-code it here. Add it in the
      # DO dashboard (App > Settings > web > Environment Variables, type SECRET).
      # Without it, AI features report "not configured"; the rest of the app is
      # unaffected. ANTHROPIC_MODEL is optional (defaults to claude-opus-4-8).
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
    health_check:
      http_path: /healthz
